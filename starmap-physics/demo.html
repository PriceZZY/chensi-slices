<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星图物理 · Starmap Physics — 沉思 Chensi</title>
<style>
  /* 纸墨四色:宣纸、墨、朱砂、安静 —— 沉思设计系统的最小移植 */
  :root { --paper: #F7F4ED; --ink: #262521; --ink-soft: #6B6659; --cinnabar: #A63A2B; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--paper); overflow: hidden; font-family: ui-serif, "Songti SC", Georgia, serif; }
  canvas { display: block; cursor: default; }
  .hint { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
    color: var(--ink-soft); font-size: 13px; letter-spacing: 0.24em; user-select: none; }
  h1 { position: fixed; left: 24px; top: 20px; color: var(--ink-soft); opacity: 0.8;
    font-size: 11px; font-weight: 400; letter-spacing: 0.34em; text-transform: uppercase; }
</style>
</head>
<body>
<h1>星图物理 · your ideas, adrift</h1>
<canvas id="sky"></canvas>
<p class="hint">拖一拖 · 或什么都不做，看它们漂</p>
<script>
// ============================================================================
// 沉思(chensi.app)想法星图的物理手感,提炼成一个文件。
// 三条规则合成了「漂」:
//   1. 漂浮:每颗星带独立相位的 sin 摆动——不同步,像水面浮物(设计要求只有一句:「一定要慢」)
//   2. 微引力:向各自锚点极弱回归——漂得开,但不散场
//   3. 互斥:近距离软推开——星和星不叠,群体自然铺开
// 入场:交错延迟 + 缓入(cubic ease-out),像墨滴一颗颗落进水里。
// ============================================================================
const cv = document.getElementById('sky')
const ctx = cv.getContext('2d')
let W, H, DPR
function resize() {
  DPR = Math.min(devicePixelRatio || 1, 2)
  W = innerWidth; H = innerHeight
  cv.width = W * DPR; cv.height = H * DPR
  cv.style.width = W + 'px'; cv.style.height = H + 'px'
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0)
}
resize(); addEventListener('resize', resize)

const INK = '#262521', SOFT = '#6B6659', CINNABAR = '#A63A2B'
// 确定性伪随机:同一批星每次刷新落在同样的位置(产品里保证「我的星图长这样」的恒常感)
let seed = 42
const rand = () => (seed = (seed * 16807) % 2147483647) / 2147483647

const N = 26
const stars = []
for (let i = 0; i < N; i++) {
  const isInk = rand() > 0.35 // 深墨 thread / 淡墨 raw 两种气质
  stars.push({
    ax: W * (0.12 + rand() * 0.76), ay: H * (0.14 + rand() * 0.68), // 锚点
    x: 0, y: 0,
    r: isInk ? 7 + rand() * 6 : 4 + rand() * 3,
    ink: isInk,
    seal: isInk && rand() > 0.72, // 少数盖朱砂印(已公开)
    phase: rand() * Math.PI * 2,  // 漂浮相位:关键——各漂各的
    speed: 0.24 + rand() * 0.22,  // 慢。再慢一点。
    amp: 7 + rand() * 9,
    appear: 0, delay: i * 90 + rand() * 240, // 交错入场
    vx: 0, vy: 0,
  })
  stars[i].x = stars[i].ax; stars[i].y = stars[i].ay
}

let drag = null, mouse = { x: -1e4, y: -1e4 }
cv.addEventListener('pointerdown', (e) => {
  const hit = stars.findLast((s) => Math.hypot(e.clientX - s.x, e.clientY - s.y) < s.r + 14)
  if (hit) { drag = hit; cv.style.cursor = 'grabbing' }
})
addEventListener('pointermove', (e) => {
  mouse.x = e.clientX; mouse.y = e.clientY
  if (drag) { drag.x = e.clientX; drag.y = e.clientY; drag.ax = e.clientX; drag.ay = e.clientY }
})
addEventListener('pointerup', () => { drag = null; cv.style.cursor = 'default' })

const easeOut = (t) => 1 - Math.pow(1 - t, 3)
let t0 = performance.now()

function tick(now) {
  const t = (now - t0) / 1000
  ctx.clearRect(0, 0, W, H)

  for (const s of stars) {
    // 入场:到点后 700ms 缓入
    if (s.appear < 1 && now - t0 > s.delay) s.appear = Math.min(1, (now - t0 - s.delay) / 700)
    if (s.appear <= 0) continue

    if (s !== drag) {
      // ① 漂浮:双轴不同频 sin,乘独立相位
      const fx = Math.sin(t * s.speed + s.phase) * s.amp
      const fy = Math.cos(t * s.speed * 0.83 + s.phase * 1.7) * s.amp * 0.8
      // ② 微引力:极弱回锚
      s.vx += (s.ax + fx - s.x) * 0.012
      s.vy += (s.ay + fy - s.y) * 0.012
      // ③ 互斥:近了软推开
      for (const o of stars) {
        if (o === s || o.appear <= 0) continue
        const dx = s.x - o.x, dy = s.y - o.y
        const d = Math.hypot(dx, dy), min = s.r + o.r + 26
        if (d > 0 && d < min) {
          const push = (min - d) / min * 0.35
          s.vx += (dx / d) * push; s.vy += (dy / d) * push
        }
      }
      s.vx *= 0.86; s.vy *= 0.86 // 阻尼:水,不是太空
      s.x += s.vx; s.y += s.vy
    }

    // 画:入场时从 62% 缩放浮现
    const a = easeOut(s.appear)
    const r = s.r * (0.62 + 0.38 * a)
    const hover = Math.hypot(mouse.x - s.x, mouse.y - s.y) < s.r + 14
    ctx.globalAlpha = a * (s.ink ? 0.92 : 0.5)
    if (s.ink) {
      ctx.fillStyle = INK
      ctx.beginPath(); ctx.arc(s.x, s.y, r, 0, 7); ctx.fill()
      if (s.seal) { // 朱砂印:右上角一枚小方章
        ctx.fillStyle = CINNABAR
        ctx.fillRect(s.x + r * 0.5, s.y - r - 3, 5, 5)
      }
    } else { // raw:淡墨晕染(径向渐变,无边界——尚未成形的念头)
      const g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, r * 2.2)
      g.addColorStop(0, 'rgba(38,37,33,0.55)'); g.addColorStop(1, 'rgba(38,37,33,0)')
      ctx.fillStyle = g
      ctx.beginPath(); ctx.arc(s.x, s.y, r * 2.2, 0, 7); ctx.fill()
    }
    if (hover && !drag) {
      ctx.globalAlpha = a * 0.35
      ctx.strokeStyle = SOFT; ctx.setLineDash([2, 5])
      ctx.beginPath(); ctx.arc(s.x, s.y, r + 7, 0, 7); ctx.stroke()
      ctx.setLineDash([])
    }
  }
  ctx.globalAlpha = 1
  if (!REDUCE) requestAnimationFrame(tick) // reduce 模式只画这一帧,循环不启动——真静止
}
// prefers-reduced-motion:静止呈现,不漂(产品同款尊重)
const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches
if (REDUCE) {
  stars.forEach((s) => { s.appear = 1 })
  tick(t0)
} else requestAnimationFrame(tick)
</script>
</body>
</html>
